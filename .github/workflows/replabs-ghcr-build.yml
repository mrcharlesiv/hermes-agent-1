name: RepLabs GHCR image build

on:
  workflow_dispatch:
  push:
    branches:
      - replabs/provider-lockdown-ghcr-build

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RepLabs Hermes image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/replabs-hermes-agent:provider-lockdown
            ghcr.io/${{ github.repository_owner }}/replabs-hermes-agent:provider-lockdown-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.replabs.upstream_revision=8f0a12ce09108553bb6dcf4b2820647387fb21ba
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}

      - name: Print digest
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/replabs-hermes-agent@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/replabs-hermes-agent@${{ steps.build.outputs.digest }}"
